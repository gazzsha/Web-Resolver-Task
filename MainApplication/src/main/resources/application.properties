# ─── Application ────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ─── Multipart upload limits (F-5) ──────────────────────────
# CSV import is the only multipart consumer (POST /api/v1/admin/tasks/import).
# 2 MB ≈ ~10 k task rows, comfortably above any realistic batch.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# ─── PostgreSQL ─────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:web_resolver}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.liquibase.enabled=false

# ─── Flyway Migrations ──────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# ─── Kafka ──────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=main-app-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.acks=all

# Note: task-cluster.consumer.* удалён вместе с TaskClusterKafkaListener (placeholder, autoStartup=false).
# Реальный consumer — TaskResultKafkaListener, использует дефолтный kafkaListenerContainerFactory
# (создаётся Spring Boot auto-config из spring.kafka.consumer.*).
kafka.config.task-cluster.producer.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka.config.task-cluster.producer.topic=task-execution
kafka.config.task-cluster.producer.acks=all

# ─── GigaChat LLM (Phase 6) ─────────────────────────────────
gigachat.auth-key=${GIGACHAT_AUTH_KEY:}
gigachat.scope=${GIGACHAT_SCOPE:GIGACHAT_API_PERS}
gigachat.model=${GIGACHAT_MODEL:GigaChat}
gigachat.oauth-base-url=${GIGACHAT_OAUTH_BASE_URL:https://ngw.devices.sberbank.ru:9443}
gigachat.api-base-url=${GIGACHAT_API_BASE_URL:https://gigachat.devices.sberbank.ru}
gigachat.request-timeout-seconds=30
gigachat.connect-timeout-ms=5000
gigachat.response-timeout-ms=30000
gigachat.max-retries=3
gigachat.token-ttl-minutes=30
gigachat.cache.ttl-minutes=60
gigachat.cache.max-size=500

# Step 6a / B.6: explainError и assessCodeQuality могут идти через LLM (короткий
# вызов с компактным промптом). По умолчанию выключено — обе функции делегируют
# в rule-based fallback (поведение до правки). Включение НЕ влияет на analyze()-
# pipeline и не затрагивает Level-2 эксперимент.
ai.explain-via-llm=${AI_EXPLAIN_VIA_LLM:false}

# ─── Auth / JWT ─────────────────────────────────────────────
# F-15: JWT_SECRET must be set to ≥32 bytes (HS256 minimum). Boot fails fast
# if missing — see JwtTokenProvider. Generate via: openssl rand -hex 32
jwt.secret=${JWT_SECRET}
jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:60}
jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:7}
# F-23: issuer claim pins tokens to this deployment so staging tokens
# don't validate in prod even if HMAC key is accidentally reused.
jwt.issuer=${JWT_ISSUER:web-resolver-task}

# ─── Prometheus scraper (basic-auth for /actuator/prometheus) ─
# Fail-fast: PROMETHEUS_SCRAPER_PASSWORD must be set in env (.env / k8s secret).
# Source-baked default removed — see DIFFERENTIAL_REVIEW_REPORT.md F-3.
prometheus.scraper.username=${PROMETHEUS_SCRAPER_USER:prometheus-scraper}
prometheus.scraper.password=${PROMETHEUS_SCRAPER_PASSWORD}

# ─── Observability (Spring Actuator + Prometheus) ───────────
# /actuator/metrics intentionally NOT exposed — leaks meter names to authenticated
# students. Prometheus uses /actuator/prometheus only. See F-2.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=web-resolver-task
management.prometheus.metrics.export.enabled=true
# Распределения времени для построения SLO
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.slo.http.server.requests=200ms,500ms,1s,3s,10s,30s

# ─── Logging ────────────────────────────────────────────────
logging.level.root=INFO
logging.level.ru=DEBUG
logging.level.ru.sandbox=DEBUG
logging.level.ru.worker=DEBUG
logging.level.ru.aianalyzer=DEBUG
