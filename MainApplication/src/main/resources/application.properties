# Main Application Configuration

server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/web_resolver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Disable Liquibase
spring.liquibase.enabled=false

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=main-app-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.acks=all

# Kafka Task Cluster Configuration (for task-resolver module)
kafka.config.task-cluster.consumer.bootstrap-servers=localhost:9092
kafka.config.task-cluster.consumer.topic=task-results
kafka.config.task-cluster.consumer.group-id=task-cluster-group
kafka.config.task-cluster.producer.bootstrap-servers=localhost:9092
kafka.config.task-cluster.producer.topic=task-execution
kafka.config.task-cluster.producer.acks=all

# AI Configuration
ai.chatgpt.api-key=${AI_CHATGPT_API_KEY:}
ai.chatgpt.model=gpt-3.5-turbo

# Logging
logging.level.root=INFO
logging.level.ru=DEBUG
logging.level.ru.sandbox=DEBUG
logging.level.ru.worker=DEBUG
logging.level.ru.aianalyzer=DEBUG

# Security
spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD:admin}
