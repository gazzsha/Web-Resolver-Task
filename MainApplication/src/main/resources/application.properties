# Main Application Configuration

server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/web_resolver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Disable Liquibase
spring.liquibase.enabled=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=main-app-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.acks=all

# Kafka Task Cluster Configuration (for task-resolver module)
kafka.config.task-cluster.consumer.bootstrap-servers=localhost:9092
kafka.config.task-cluster.consumer.topic=task-results
kafka.config.task-cluster.consumer.group-id=task-cluster-group
kafka.config.task-cluster.producer.bootstrap-servers=localhost:9092
kafka.config.task-cluster.producer.topic=task-execution
kafka.config.task-cluster.producer.acks=all

# GigaChat LLM
gigachat.auth-key=${GIGACHAT_AUTH_KEY:}
gigachat.scope=${GIGACHAT_SCOPE:GIGACHAT_API_PERS}
gigachat.model=${GIGACHAT_MODEL:GigaChat}
gigachat.oauth-base-url=${GIGACHAT_OAUTH_BASE_URL:https://ngw.devices.sberbank.ru:9443}
gigachat.api-base-url=${GIGACHAT_API_BASE_URL:https://gigachat.devices.sberbank.ru}
gigachat.request-timeout-seconds=30
gigachat.connect-timeout-ms=5000
gigachat.response-timeout-ms=30000
gigachat.max-retries=3
gigachat.token-ttl-minutes=30
gigachat.cache.ttl-minutes=60
gigachat.cache.max-size=500

# Logging
logging.level.root=INFO
logging.level.ru=DEBUG
logging.level.ru.sandbox=DEBUG
logging.level.ru.worker=DEBUG
logging.level.ru.aianalyzer=DEBUG

# Security
spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD:admin}
