# Alertmanager — минимальный конфиг для dev-стенда.
# Все алерты принимаются и молча дропаются в receiver 'null'.
#
# Для production подменить receiver 'null' на slack/telegram:
#   receivers:
#     - name: 'slack'
#       slack_configs:
#         - api_url: 'https://hooks.slack.com/services/XXX/YYY/ZZZ'
#           channel: '#alerts'
#           send_resolved: true
#     - name: 'telegram'
#       telegram_configs:
#         - bot_token: '<BOT_TOKEN>'
#           chat_id: <CHAT_ID>
#           send_resolved: true

global:
  resolve_timeout: 5m

route:
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'null'

receivers:
  - name: 'null'

inhibit_rules: []
