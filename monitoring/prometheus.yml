global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: web-resolver-task
    env: local

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  - job_name: 'web-resolver-main'
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    basic_auth:
      username: prometheus-scraper
      password_file: /etc/prometheus/scraper_password
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: main-application
          tier: backend

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'postgres'
    scrape_interval: 15s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: postgres

  - job_name: 'kafka'
    scrape_interval: 15s
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels:
          service: kafka

  - job_name: 'node'
    scrape_interval: 15s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: node

  - job_name: 'alertmanager'
    scrape_interval: 15s
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          service: alertmanager
