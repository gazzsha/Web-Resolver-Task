openapi: "3.0.1"
info:
  title: Task Resolver API
  version: v1
tags:
  - name: Task Resolver
    description: Методы для работы с Task Resolver
  - name: Tasks
    description: Методы для получения списка задач
security:
  - basicAuth: [ ]
paths:
  /api/v1/tasks:
    get:
      tags:
        - Tasks
      summary: Получить список всех задач
      operationId: getAllTasks
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskInfo'
        '403':
          description: Доступ запрещен
          content:
            application/json:
              schema:
                $ref: './common-models.yml#/components/schemas/ErrorResponse'
        '500':
          description: Системная ошибка
          content:
            application/json:
              schema:
                $ref: './common-models.yml#/components/schemas/ErrorResponse'
  /api/v1/tasks/{taskId}:
    get:
      tags:
        - Tasks
      summary: Получить задачу по ID
      operationId: getTaskById
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInfo'
        '404':
          description: Задача не найдена
          content:
            application/json:
              schema:
                $ref: './common-models.yml#/components/schemas/ErrorResponse'
        '500':
          description: Системная ошибка
          content:
            application/json:
              schema:
                $ref: './common-models.yml#/components/schemas/ErrorResponse'
  /api/v1/task-resolver/task/start:
    patch:
      tags:
        - Task Resolver
      summary: Запустить проверку задачи
      operationId: startTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTaskRequest'
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartTaskSuccessResponse'
        '400':
          description: Невалидный запрос
          content:
            application/json:
              schema:
                $ref: './common-models.yml#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещен
          content:
            application/json:
              schema:
                $ref: './common-models.yml#/components/schemas/ErrorResponse'
        '500':
          description: Системная ошибка
          content:
            application/json:
              schema:
                $ref: './common-models.yml#/components/schemas/ErrorResponse'
components:
  schemas:
    TaskInfo:
      title: Информация о задаче
      required:
        - testId
        - title
        - description
        - difficulty
      properties:
        testId:
          type: string
          format: uuid
          example: 291a98ff-4eeb-4586-99a2-b19642bbe5ff
        title:
          type: string
          example: "Two Sum"
        description:
          type: string
          example: "Given an array of integers, return indices of the two numbers that add up to a specific target."
        difficulty:
          $ref: './common-models.yml#/components/schemas/Difficulty'
        category:
          type: string
          example: "Array"
    StartTaskSuccessResponse:
      title: Успешный ответ на запуск задачи
      required:
        - result
      properties:
        result:
          $ref: './common-models.yml#/components/schemas/ResultResponse'
        id:
          $ref: './common-models.yml#/components/schemas/Id'
    StartTaskRequest:
      title: Запрос на запуск задачи
      required:
        - testId
        - code
        - language
      properties:
        testId:
          type: string
          format: uuid
          example: 291a98ff-4eeb-4586-99a2-b19642bbe5ff
        language:
          $ref: './common-models.yml#/components/schemas/lang'
        code:
          type: string
          nullable: false
          example: |
            class Solution {
              public int sum(int a, int b) {
                return a + b;
              }
            }
            
          
        




