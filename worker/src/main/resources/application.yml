server:
  port: ${WORKER_SERVER_PORT:8081}

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_WORKER_GROUP_ID:worker-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-interval-ms: 300000
      session-timeout-ms: 30000
    producer:
      acks: all
      retries: 3

kafka:
  worker:
    topic: task-execution
  result:
    topic: task-results

sandbox:
  docker:
    enabled: true
    network: none
    read-only: true
    memory-limit-mb: 256
    cpu-limit: 1.0
  timeout-seconds: 5
  max-memory-limit-mb: 512
  max-timeout-seconds: 10

worker:
  concurrency: 3
  max-tasks-per-poll: 10

gigachat:
  auth-key: ${GIGACHAT_AUTH_KEY:}
  scope: ${GIGACHAT_SCOPE:GIGACHAT_API_PERS}
  model: ${GIGACHAT_MODEL:GigaChat}
  oauth-base-url: ${GIGACHAT_OAUTH_BASE_URL:https://ngw.devices.sberbank.ru:9443}
  api-base-url: ${GIGACHAT_API_BASE_URL:https://gigachat.devices.sberbank.ru}
  request-timeout-seconds: 30
  connect-timeout-ms: 5000
  response-timeout-ms: 30000
  max-retries: 3
  token-ttl-minutes: 30
  cache:
    ttl-minutes: 60
    max-size: 500

logging:
  level:
    root: INFO
    ru.worker: DEBUG
    ru.sandbox: DEBUG
    ru.aianalyzer: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always
