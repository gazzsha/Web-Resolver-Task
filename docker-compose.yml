version: "3.9"

services:
  # PostgreSQL Database
  postgres:
    image: docker-proxy.artifactory.tcsbank.ru/postgres:16-alpine
    container_name: web-resolver-db
    environment:
      POSTGRES_DB: ${DIPLOM_DB_NAME:-web_resolver}
      POSTGRES_USER: ${DIPLOM_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DIPLOM_DB_PASSWORD:-postgres}
    ports:
      - "${DIPLOM_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DIPLOM_DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - web-resolver-network

  # Apache Kafka
  zookeeper:
    image: docker-proxy.artifactory.tcsbank.ru/confluentinc/cp-zookeeper:7.5.0
    container_name: web-resolver-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - web-resolver-network

  kafka:
    image: docker-proxy.artifactory.tcsbank.ru/confluentinc/cp-kafka:7.5.0
    container_name: web-resolver-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - web-resolver-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

